name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Lint, typecheck, tests and build run as independent parallel jobs.
# Pull requests run only the Vitest tests their diff can reach
# (`vitest run --changed <merge-base>`); pushes to main, manual runs and PRs
# that touch dependency/config/generated/non-module inputs run the full suite,
# split across shards. See .github/scripts/test-plan.sh for the rules.

jobs:
  plan:
    name: Plan test run
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      base: ${{ steps.plan.outputs.base }}
      shards: ${{ steps.plan.outputs.shards }}
      shard_total: ${{ steps.plan.outputs.shard_total }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Choose full or changed-only tests
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          mode=full
          base=""
          reason="${EVENT_NAME} always runs the full suite"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            base="$(git merge-base "origin/${BASE_REF}" HEAD)"
            plan="$(.github/scripts/test-plan.sh "$base" HEAD)"
            mode="$(sed -n 's/^mode=//p' <<< "$plan")"
            reason="$(sed -n 's/^reason=//p' <<< "$plan")"
          fi
          if [ "$mode" = "full" ]; then
            shards='[1,2,3]'; total=3
          else
            shards='[1]'; total=1
          fi
          echo "Test plan: mode=$mode base=${base:-n/a} ($reason)"
          {
            echo "mode=$mode"
            echo "base=$base"
            echo "shards=$shards"
            echo "shard_total=$total"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Test plan"
            echo "- mode: \`$mode\`"
            echo "- merge base: \`${base:-n/a}\`"
            echo "- reason: $reason"
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint and repo contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-deps

      - name: Docs contract
        run: npm run docs:check

      - name: Tracked secret audit
        run: npm run release:secret-audit

  typecheck:
    name: Typecheck (tsgo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-deps

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Tests (${{ needs.plan.outputs.mode }}${{ needs.plan.outputs.mode == 'full' && format(' {0}/{1}', matrix.shard, needs.plan.outputs.shard_total) || '' }})
    needs: plan
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Changed-only runs diff against the merge base, which needs history.
          fetch-depth: ${{ needs.plan.outputs.mode == 'changed' && '0' || '1' }}

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-deps

      - name: Unit and integration tests (full, sharded)
        if: needs.plan.outputs.mode == 'full'
        shell: bash
        run: npx vitest run --reporter=dot --shard=${{ matrix.shard }}/${{ needs.plan.outputs.shard_total }}

      - name: Unit and integration tests (changed since merge base)
        if: needs.plan.outputs.mode == 'changed'
        shell: bash
        run: npx vitest run --reporter=dot --changed ${{ needs.plan.outputs.base }} --passWithNoTests

  build:
    name: Build (web, extension, DSH, Rust)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        if: github.event_name != 'pull_request'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-deps

      - name: Audit DSH plugin dependencies
        if: github.event_name != 'pull_request'
        run: npm audit --prefix dsh-plugin --audit-level=moderate

      - name: Verify release versions
        if: github.event_name != 'pull_request'
        run: npm run version:check

      - name: Release red-team invariants
        if: github.event_name != 'pull_request'
        run: npm run release:red-team

      - name: Web build
        run: npm run build

      - name: Browser extension build
        run: npm run ext:build

      - name: DSH plugin build
        if: github.event_name != 'pull_request'
        run: npm --prefix dsh-plugin run build

      - name: Build Tauri agent sidecar fixture
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          node scripts/build-agent-sidecar.mjs --target x86_64-pc-windows-msvc
          $agent = 'src-tauri/binaries/flovart-agent-x86_64-pc-windows-msvc.exe'
          if (-not (Test-Path -LiteralPath $agent -PathType Leaf)) {
            throw "Agent sidecar was not produced: $agent"
          }
          if ((Get-Item -LiteralPath $agent).Length -le 0) {
            throw "Agent sidecar is empty: $agent"
          }

      - name: Rust tests
        if: github.event_name != 'pull_request'
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Git diff check
        run: git diff --check

  critical-stability:
    name: Critical suite 10x
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-deps

      - name: Audit DSH plugin dependencies
        run: npm audit --prefix dsh-plugin --audit-level=moderate

      - name: Critical suite repeated ten times
        run: npm run test:critical
