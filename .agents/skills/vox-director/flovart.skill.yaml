schemaVersion: flovart.production-skill/1
id: community.vox-director
version: 1.0.0
productionSpec:
  coreVersion: "1"
  extensionSchema: schemas/extension.schema.json
runtime:
  minVersion: 0.3.0
capabilities:
  - image.generate
  - video.generate
  - audio.tts
  - audio.music
  - media.render
  - media.verify
permissions:
  network: none
  secrets: none
  filesystem: package-readonly
gates:
  - id: approve-spec
    type: spec
  - id: approve-style
    type: style-reference
  - id: review-keyframes
    type: keyframe-review
  - id: verify-ocr
    type: ocr
evals:
  entry: evals/cases.json
license: MIT
provenance:
  source: https://github.com/avabbbb/vox-director
  adaptation: flovart-provider-neutral-example
trustTier: bundled-example
inputs:
  - id: topic
    label: 主题或 Brief
    kind: longtext
    required: true
    placeholder: 在这里填写主题或粘贴 Brief
  - id: duration
    label: 时长
    kind: choice
    options: ["15 秒", "30 秒", "60 秒"]
    default: 30 秒
  - id: language
    label: 语言
    kind: choice
    options: [中文, English]
    default: 中文
  - id: references
    label: 参考素材（可选）
    kind: image
    placeholder: 可选
