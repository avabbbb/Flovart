services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flovart
    ports:
      - "${FLOVART_DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flovart"]
      interval: 5s
      timeout: 3s
      retries: 10

  hub:
    build: ./backend
    environment:
      PORT: "11452"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/flovart?sslmode=disable"
      JWT_SECRET: "flovart-dev-secret-change-in-production"
      JWT_EXP_HOURS: "168"
      CORS_ALLOW: "*"
    ports:
      - "${FLOVART_HUB_PORT:-11452}:11452"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    ports:
      - "${FLOVART_WEB_PORT:-1635}:1635"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_HUB_BASE_URL: "http://localhost:${FLOVART_HUB_PORT:-11452}/api/v1"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - hub

volumes:
  db-data:
