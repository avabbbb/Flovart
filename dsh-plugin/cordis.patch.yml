# @flovart/dsh-plugin bundle patch layer.
#
# Applied after the dsh-base and dsh-web-app bundle layers of the `iris`
# profile (see $DSH_HOME/profiles/iris/package.json → dsh.profile.bundles).
# One row provides both halves of the plugin:
#   - the Node/Cordis half (`@flovart/dsh-plugin` main entry) registers the
#     `iris` service (CLI discovery + runtime status) and derives only the
#     five stable model tools from the CLI registry, executing every
#     call through the public CLI facade (`Iris CLI 门面`);
#   - the browser half (`exports["./client"]`, discovered through the
#     `dsh.client` manifest declaration) registers the additive
#     `conversation.view` (contextual Iris Workflow summary) and
#     `shell.overlay` (status/approval/Artifact light overlays).
#
# RC8 boundary: we never occupy the exclusive root `sidebar`, root
# `conversation` or `conversation.session` slots. The session-scoped view is a
# read-only contextual projection of the visible Browser Workflow and talks to
# the authenticated local Workspace Operator through a narrow same-origin host
# proxy. The Workspace token never enters the browser bundle.
#
# The row config is evaluated at row start, so it only reads process.env
# (same proven idiom as the web-app layer's DSH_TOOLS_MODE seam). A future
# slice may move the discovered origin into a service-backed expression once
# a multi-row/single-bundle instance layout is validated against a real RC8
# install.

- insert:
    - id: iris
      name: '@flovart/dsh-plugin'
      inject:
        - tools
        - webServer
      config:
        # The launcher prepares this authenticated loopback Workspace Operator.
        # The host keeps these values private and proxies only health/tools routes.
        workspaceUrl: !!js process.env.IRIS_WORKSPACE_URL ?? 'http://127.0.0.1:17372'
        workspaceToken: !!js process.env.IRIS_WORKSPACE_TOKEN ?? ''
        cli: !!js process.env.IRIS_CLI ?? 'iris'
        workspaceMode: !!js process.env.IRIS_WORKSPACE_MODE ?? 'browser'
        toolTimeoutMs: 30000
        # Iris-side policy for these model tools: DSH's own sandbox/approval
        # govern DSH tools, not plugin tools that write the Browser Workflow.
        # read-only denies every Workflow write; on-request allows reversible
        # writes; untrusted asks for every reversible write. Delete and paid runs
        # are confirmed by the Iris command surface, so the gate stays silent
        # for them (no double prompt). `ask` goes through the Harness approval
        # seam and degrades to denial when no approval service is composed.
        sandbox: !!js process.env.IRIS_SANDBOX ?? 'workspace-write'
        approval: !!js process.env.IRIS_APPROVAL ?? 'on-request'
